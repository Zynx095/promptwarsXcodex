<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#3a0f34" />
    <title>FairShift is offline</title>
    <link rel="icon" href="/icons/icon-192.png" />
    <script src="/theme-init.js"></script>
    <style>
      :root {
        --bg: #eef1f4;
        --card: #ffffff;
        --ink: #2b1027;
        --ink-2: #5e4659;
        --accent: #3a0f34;
        --line: #dde3e8;
        color-scheme: light;
      }
      :root[data-theme='dark'] {
        --bg: #150e14;
        --card: #241a22;
        --ink: #f6eff4;
        --ink-2: #d6c7d1;
        --accent: #e5b7da;
        --line: #3b2d38;
        color-scheme: dark;
      }
      :root[data-theme='night'] {
        --bg: #0f0b0e;
        --card: #1a1418;
        --ink: #e2d7dd;
        --ink-2: #bfb0b9;
        --accent: #cfa6c5;
        --line: #2e252b;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font:
          16px/1.55 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          'Nirmala UI',
          sans-serif;
      }
      main {
        max-width: 28rem;
        width: 100%;
        padding: 28px 24px;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: var(--card);
      }
      .mark {
        width: 48px;
        height: 48px;
        display: block;
        margin-bottom: 16px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.5rem;
        line-height: 1.25;
      }
      p {
        margin: 0 0 12px;
        color: var(--ink-2);
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        margin-top: 8px;
        padding: 0 20px;
        border-radius: 12px;
        background: #eaaa00;
        color: #24081f;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="/icons/icon-192.png" alt="" width="48" height="48" />
      <h1>You are offline</h1>
      <p>FairShift could not reach the internet, and this page has not been saved on this phone yet.</p>
      <p>Once FairShift has been opened online, it starts without a connection and keeps check-ins and safety reports on this phone until it can send them.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
